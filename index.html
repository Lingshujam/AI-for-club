<style>
/* ========== 全局样式 ========== */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
  background: #E3F2FD;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

.app-container {
  width: 100%;
  max-width: 540px;
  height: 100vh;
  max-height: 780px;
  background: #fff;
  border-radius: 16px;
  box-shadow: 0 8px 40px rgba(25, 118, 210, 0.12);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ========== 顶部标题栏 ========== */
.header {
  background: linear-gradient(135deg, #BBDEFB 0%, #90CAF9 100%);
  padding: 16px 20px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid #BBDEFB;
}
.header .title {
  font-size: 20px;
  font-weight: 700;
  color: #1565C0;
  letter-spacing: 1px;
}
.header .subtitle {
  font-size: 12px;
  color: #1E88E5;
  margin-top: 2px;
  opacity: 0.75;
}

/* ========== 聊天区域 ========== */
.chat-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px 8px;
  background: #F5F9FF;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.chat-area::-webkit-scrollbar { width: 5px; }
.chat-area::-webkit-scrollbar-thumb { background: #BBDEFB; border-radius: 10px; }

/* ========== 消息气泡 ========== */
.message {
  display: flex;
  gap: 10px;
  max-width: 90%;
  animation: fadeIn 0.3s ease;
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.message.bot { align-self: flex-start; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  flex-shrink: 0;
  line-height: 1;
}
.message.bot .avatar { background: #BBDEFB; }
.message.user .avatar { background: #E3F2FD; }

.bubble {
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 15px;
  line-height: 1.75;
  word-break: break-word;
  white-space: pre-wrap;
}
.message.bot .bubble {
  background: #fff;
  border: 1px solid #E3F2FD;
  border-top-left-radius: 4px;
  color: #263238;
}
.message.user .bubble {
  background: #BBDEFB;
  border-top-right-radius: 4px;
  color: #0D47A1;
}

/* ========== 推荐结果卡片 ========== */
.recommend-cards {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-top: 8px;
}
.rec-card {
  background: #fff;
  border: 1.5px solid #90CAF9;
  border-radius: 14px;
  padding: 16px;
}
.rec-card:first-child {
  border-color: #1565C0;
  border-width: 2px;
  background: #FAFDFF;
}
.rec-card .rec-badge {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  color: #fff;
  background: #1565C0;
  padding: 2px 10px;
  border-radius: 10px;
  margin-bottom: 8px;
}
.rec-card .rec-dept {
  font-size: 12px;
  color: #1976D2;
  font-weight: 600;
  margin-bottom: 2px;
}
.rec-card .rec-title {
  font-size: 17px;
  font-weight: 700;
  color: #0D47A1;
  margin-bottom: 12px;
}
.rec-card .rec-section {
  margin-top: 10px;
}
.rec-card .rec-label {
  font-size: 13px;
  font-weight: 600;
  color: #1565C0;
  margin-bottom: 4px;
}
.rec-card .rec-text {
  font-size: 14px;
  color: #455A64;
  line-height: 1.75;
  white-space: pre-wrap;
}
.rec-card .rec-reason {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed #BBDEFB;
  font-size: 13px;
  color: #1976D2;
}

/* ========== 快捷标签 ========== */
.quick-row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
}
.quick-chip {
  padding: 8px 14px;
  background: #fff;
  border: 1px solid #BBDEFB;
  border-radius: 20px;
  font-size: 13px;
  color: #1565C0;
  cursor: pointer;
  transition: all 0.2s;
  user-select: none;
}
.quick-chip:hover {
  background: #BBDEFB;
  border-color: #90CAF9;
}
.quick-chip.highlight {
  background: #1565C0;
  color: #fff;
  border-color: #1565C0;
}
.quick-chip.highlight:hover {
  background: #0D47A1;
}

/* 推荐问卷选项 */
.quiz-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-top: 10px;
}
.quiz-btn {
  padding: 12px 16px;
  background: #fff;
  border: 1.5px solid #E3F2FD;
  border-radius: 12px;
  font-size: 14px;
  color: #263238;
  cursor: pointer;
  transition: all 0.2s;
  text-align: left;
  user-select: none;
  line-height: 1.5;
}
.quiz-btn:hover {
  border-color: #1565C0;
  background: #F5F9FF;
}

/* ========== 次要功能入口：岗位匹配度测试 ========== */
.feature-bar {
  padding: 10px 16px 0;
  background: #fff;
  flex-shrink: 0;
}
.quiz-entry {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid #BBDEFB;
  border-radius: 12px;
  background: #F5F9FF;
  color: #1565C0;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.quiz-entry:hover {
  background: #E3F2FD;
  border-color: #90CAF9;
}

/* ========== 输入区域 ========== */
.input-area {
  padding: 12px 16px;
  background: #fff;
  border-top: 1px solid #E3F2FD;
  display: flex;
  gap: 10px;
  flex-shrink: 0;
}
.input-area input {
  flex: 1;
  padding: 12px 16px;
  border: 1.5px solid #E3F2FD;
  border-radius: 24px;
  font-size: 15px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}
.input-area input:focus {
  border-color: #90CAF9;
}
.input-area input::placeholder {
  color: #B0BEC5;
}
.send-btn {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  border: none;
  background: #1565C0;
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.send-btn:hover { background: #0D47A1; }
.send-btn:active { transform: scale(0.95); }
.send-btn:disabled {
  background: #B0BEC5;
  cursor: not-allowed;
}

/* ========== 响应式 ========== */
@media (max-width: 540px) {
  .app-container {
    max-width: 100%;
    height: 100vh;
    max-height: 100vh;
    border-radius: 0;
  }
}
</style>
</head>

<div class="app-container">
  <div class="header">
    <div class="title">🎓 学生会招新助手</div>
    <div class="subtitle">随时问我任何关于学生会的问题吧~</div>
  </div>

  <div class="chat-area" id="chatArea"></div>

  <div class="feature-bar">
    <button class="quiz-entry" id="quizEntry">✨ 不知道适合什么岗位？做个匹配度测试</button>
  </div>

  <div class="input-area">
    <input type="text" id="msgInput" placeholder="请输入关于学生会的问题..." autofocus>
    <button class="send-btn" id="sendBtn" title="发送">➤</button>
  </div>
</div>

  var sortedItems = items.slice().sort(function(a, b) {
    return b.length - a.length;
  });

  for (var i = 0; i < sortedItems.length; i++) {
    if (text.indexOf(sortedItems[i]) !== -1) {
      return sortedItems[i];
    }
  }

  return '';
}

function resolveQuestionContext(question) {
  var department = detectContextItem(
    question,
    contextDepartments
  );

  var position = detectContextItem(
    question,
    contextPositions
  );

  if (department) {
    conversationContext.department = department;
  }

  if (position) {
    conversationContext.position = position;
  }

  var resolvedQuestion = question;

  var refersToPreviousPosition =
    /这个岗位|该岗位|这个职位|它|这类岗位/.test(question);

  var asksOtherDepartments =
    /其他部门|别的部门|其余部门|类似岗位|同类岗位/.test(question);

  if (
    (refersToPreviousPosition || asksOtherDepartments) &&
    !position &&
    conversationContext.position
  ) {
    resolvedQuestion +=
      ' ' + conversationContext.position;
  }

  // 如果没有说“其他部门”，则保留上一轮具体部门
  if (
    refersToPreviousPosition &&
    !asksOtherDepartments &&
    !department &&
    conversationContext.department
  ) {
    resolvedQuestion +=
      ' ' + conversationContext.department;
  }

  return resolvedQuestion;
}

function loadLocalKnowledge() {
  fetch('./knowledge.md')
    .then(function(response) {
      if (!response.ok) {
        throw new Error('knowledge.md 加载失败');
      }
      return response.text();
    })
    .then(function(markdown) {
      localKnowledgeSections = splitLocalKnowledge(markdown);
      localKnowledgeReady = true;
      console.log('知识库加载成功，共', localKnowledgeSections.length, '个板块');
    })
    .catch(function(error) {
      console.error('知识库加载失败：', error);
      localKnowledgeReady = false;
    });
}

function splitLocalKnowledge(markdown) {
  var sections = [];
  var blocks = markdown.split(/(?=^#{1,4}\s)/m);

  // 拆分普通标题板块
  for (var i = 0; i < blocks.length; i++) {
    var content = blocks[i].trim();
    if (!content) continue;

    var firstLine = content.split('\n')[0];
    var title = firstLine.replace(/^#{1,6}\s*/, '').trim();

    sections.push({
      title: title,
      content: content,
      type: 'section'
    });
  }

  // 单独拆分“常见问题”中的每一组问答
  var faqPattern = /问[：:]\s*(.+?)\n+\s*答[：:]\s*([\s\S]*?)(?=\n+\s*问[：:]|$)/g;
  var match;

  while ((match = faqPattern.exec(markdown)) !== null) {
    sections.push({
      title: match[1].trim(),
      content: match[2].trim(),
      type: 'faq'
    });
  }

  return sections;
}

// ==================== 部门具体岗位问答 ====================
function findPositionAnswer(question) {
  var departments = [
    '活动部', '文宣部', '权益部',
    '学术部', '社联部', '外联部'
  ];

  var positions = [
    '公众号运营', '活动运营', '财务运营', '宣发运营',
    '美术设计', '社团规划', '内外联', '文美编',
    '编导', '摄影', '剪辑', '设计',
    '运营', '文编', '美编', '秘书',
    '财务', '策划', '公关', '行政'
  ];

  var departmentName = '';
  var positionName = '';

  for (var i = 0; i < departments.length; i++) {
    if (question.indexOf(departments[i]) !== -1) {
      departmentName = departments[i];
      break;
    }
  }

  // 长岗位名称优先
  positions.sort(function(a, b) {
    return b.length - a.length;
  });

  for (var j = 0; j < positions.length; j++) {
    if (question.indexOf(positions[j]) !== -1) {
      positionName = positions[j];
      break;
    }
  }

  if (!positionName) {
    return null;
  }

  var answers = [];

  for (var k = 0; k < localKnowledgeSections.length; k++) {
    var section = localKnowledgeSections[k];

    if (departments.indexOf(section.title) === -1) {
      continue;
    }

    // 用户指定了部门时，只读取该部门
    if (departmentName && section.title !== departmentName) {
      continue;
    }

    var lines = section.content.split('\n');
    var currentPart = '';
    var departmentResults = [];

    for (var m = 0; m < lines.length; m++) {
      var line = lines[m].trim();

      if (/^招新岗位[：:]/.test(line)) {
        currentPart = '招募人数';
        continue;
      }

      if (/^工作内容[：:]/.test(line)) {
        currentPart = '工作内容';
        continue;
      }

      if (/^希望你具备[：:]/.test(line)) {
        currentPart = '能力要求';
        continue;
      }

      var bulletMatch = line.match(/^[-•]\s*([^：:]+)[：:]\s*(.*)$/);

      if (bulletMatch) {
        var linePosition = bulletMatch[1].trim();
        var lineContent = bulletMatch[2].trim();

        var isSamePosition =
          linePosition === positionName ||
          linePosition.indexOf(positionName + '（') === 0;

        if (isSamePosition) {
          departmentResults.push(
            currentPart + '：' + lineContent
          );
        }
      }
    }

    if (departmentResults.length > 0) {
      if (departmentName) {
        // 已指定部门，只显示岗位资料
        answers.push(departmentResults.join('\n\n'));
      } else {
        // 未指定部门，展示所有同名岗位，避免随便选一个
        answers.push(
          section.title + positionName + '：\n' +
          departmentResults.join('\n')
        );
      }
    }
  }

  if (answers.length === 0) {
    return null;
  }

  if (!departmentName && answers.length > 1) {
    return (
      '不同部门的“' + positionName +
      '”要求有所不同：\n\n' +
      answers.join('\n\n')
    );
  }

  return answers.join('\n\n');
}
      
function searchLocalKnowledge(question) {
  var normalizedQuestion = normalizeSearchText(question);
  var terms = buildSearchTerms(question);


   // 区分岗位时间投入和报名日期
  var asksWorkload =
    /一周|每周|每星期|时间投入|投入时间|工作时间|工作时长|花多少时间|要花多久|忙不忙|工作量|工作强度/.test(
      question
    );

  if (asksWorkload) {
    return (
      '目前无法给出学生会所有岗位统一的每周投入小时数，' +
      '不同部门、岗位和活动阶段的工作量会有明显差异。' +
      '\n\n现有公开资料只能确认：权益部日常性工作相对较多；' +
      '外联部的出访通常安排在周末。' +
      '\n\n其他岗位的例会、值班和每周投入时间，建议以当届部门招新说明或部长确认的信息为准。'
    );
  } 

  var relatedPositionAnswer =
  findRelatedPositionAnswer(question);
      
  if (relatedPositionAnswer) {
  return relatedPositionAnswer;
  }
 
  var positionAnswer = findPositionAnswer(question);

  if (positionAnswer) {
    return positionAnswer;
  }
  // 常见问题优先匹配，避免模糊搜索选错
  var directRules = [
    {
      pattern: /什么时候.*招新|啥时候.*招新|招新.*时间|报名.*时间|几号.*截止|截止.*日期/,
      title: '报名时间'
    },
    {
      pattern: /怎么.*报名|咋.*报名|如何.*报名|报名.*方式|怎样.*申请/,
      title: '报名方式'
    },
    {
      pattern: /哪些部门|什么部门|几个部门|组织架构/,
      title: '组织架构'
    },
    {
      pattern: /报名.*流程|招新.*流程|需要.*步骤/,
      title: '招新流程'
    },
    {
      pattern: /报名.*条件|谁能报名|招新对象|什么人.*报名/,
      title: '招新对象'
    },
    {
      pattern: /面试.*流程|怎么.*面试/,
      title: '面试流程'
    }
  ];

  for (var ruleIndex = 0; ruleIndex < directRules.length; ruleIndex++) {
    if (directRules[ruleIndex].pattern.test(question)) {
      for (var sectionIndex = 0; sectionIndex < localKnowledgeSections.length; sectionIndex++) {
        if (
          localKnowledgeSections[sectionIndex].title.indexOf(
            directRules[ruleIndex].title
          ) !== -1
        ) {
          return formatKnowledgeAnswer(
            localKnowledgeSections[sectionIndex]
          );
        }
      }
    }
  }
  var bestSection = null;
  var bestScore = 0;

  for (var i = 0; i < localKnowledgeSections.length; i++) {
    var section = localKnowledgeSections[i];
    var title = normalizeSearchText(section.title);
    var content = normalizeSearchText(section.content);
    var score = 0;

    for (var j = 0; j < terms.length; j++) {
      var term = terms[j];
      if (!term) continue;

      if (title.indexOf(term) !== -1) {
        score += 8;
      }

      if (content.indexOf(term) !== -1) {
        score += 2;
      }
    }

    if (title && normalizedQuestion.indexOf(title) !== -1) {
      score += 12;
    }

    if (score > bestScore) {
      bestScore = score;
      bestSection = section;
    }
  }

  if (!bestSection || bestScore < 2) {
    return null;
  }

  return formatKnowledgeAnswer(bestSection);
}

function buildSearchTerms(question) {

},
{

},

    },
    {

      words: ['适合人群', '岗位匹配', '兴趣与岗位', '能力与岗位']
    },
    {

    },
    {

      words: ['正式批', '正式报名']
    },

    },
    {

    },
    {

    },
    {
      pattern: /怎么提交|发到哪里|邮件|附件|网盘/,

    },
    {
      pattern: /无效|失败|注意事项|出错/,
      words: ['申请无效', '逾期提交', '格式错误']
    },
    {
      pattern: /面试|考核/,
      words: ['面试流程', '面试准备', '面试']
    },
    {
      pattern: /招多少人|几个人|人数|名额/,
      words: ['招新岗位', '人']
    },
    {
      pattern: /活动|项目|举办过/,
      words: ['代表活动', '活动']
    }
  ];

  for (var i = 0; i < synonymGroups.length; i++) {
    if (synonymGroups[i].pattern.test(question)) {
      terms = terms.concat(synonymGroups[i].words);
    }
  }

  // 保留问题中的部门名和岗位名
  var importantWords = text
    .replace(/学生会|请问|我想知道|能不能|可不可以|怎么样|是什么/g, '');

  // 提取2～4个字的词组，支持部门及岗位名称
  for (var length = 4; length >= 2; length--) {
    for (var j = 0; j <= importantWords.length - length; j++) {
      var term = importantWords.slice(j, j + length);

      if (!/什么|怎么|一下|这个|那个|是否/.test(term)) {
        terms.push(term);
      }
    }
  }

  return removeDuplicateTerms(terms);
}

  

function normalizeSearchText(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/\s+/g, '')
    .replace(/[，。！？、；：“”‘’（）《》【】\-_*#`~]/g, '');
}

function removeDuplicateTerms(terms) {
  var result = [];

  for (var i = 0; i < terms.length; i++) {
    if (terms[i] && result.indexOf(terms[i]) === -1) {
      result.push(terms[i]);
    }
  }

  return result;
}

function formatKnowledgeAnswer(section) {
  var text = section.content
    // 删除“根据招新知识库”
    .replace(/根据招新知识库[：:]?/g, '')

    // 删除 Markdown 标题整行
    .replace(/^#{1,6}\s+.*$/gm, '')

    // 删除“1.2 组织架构”这类数字章节标题
    .replace(/^\s*\d+(?:\.\d+)+\s+[^\n]*$/gm, '')

    // 清理其他 Markdown 格式
    .replace(/\*\*(.*?)\*\*/g, '$1')
    .replace(/__(.*?)__/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/\[([^\]]+)\]\([^)]+\)/g, '$1')
    .replace(/^\s*[-*+]\s+/gm, '• ')
    .replace(/^.*知识库暂未提供准确信息.*$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();

  if (text.length > 1800) {
    text =
      text.slice(0, 1800) +
      '\n\n更多内容可以继续询问具体部门或岗位。';
  }

  return text;
}

// ==================== 智能匹配 ====================
function findAnswer(text) {
  // 1. 检查是否问某个部门
  for (var i = 0; i < KNOWLEDGE.departments.length; i++) {
    var dept = KNOWLEDGE.departments[i];
    if (text.indexOf(dept.name) !== -1) {
      return formatDept(dept);
    }
  }

  // 2. 检查通用问答
  for (var j = 0; j < KNOWLEDGE.general.length; j++) {
    if (matchKW(text, KNOWLEDGE.general[j].keywords)) {
      return KNOWLEDGE.general[j].answer;
    }
  }

  // 3. 检查FAQ
  for (var k = 0; k < KNOWLEDGE.faqs.length; k++) {
    if (matchKW(text, KNOWLEDGE.faqs[k].keywords)) {
      return KNOWLEDGE.faqs[k].answer;
    }
  }

  // 4. 模糊匹配
  var best = 0;
  var bestAnswer = null;
  var all = KNOWLEDGE.faqs.concat(KNOWLEDGE.general);
  for (var m = 0; m < all.length; m++) {
    for (var n = 0; n < all[m].keywords.length; n++) {
      var s = textSim(text, all[m].keywords[n]);
      if (s > best) { best = s; bestAnswer = all[m].answer; }
    }
  }

  if (best > 0.35) return bestAnswer;
  return null;
}

function matchKW(text, keywords) {
  for (var i = 0; i < keywords.length; i++) {
    if (text.indexOf(keywords[i]) !== -1) return true;
  }
  return false;
}

function textSim(a, b) {
  var setA = {};
  var setB = {};
  for (var i = 0; i < a.length; i++) { setA[a[i]] = 1; }
  for (var j = 0; j < b.length; j++) { setB[b[j]] = 1; }
  var common = 0;
  for (var k in setA) { if (setB[k]) common++; }
  return common / Math.max(Object.keys(setA).length, Object.keys(setB).length);
}

// ==================== 部门信息 ====================
function formatDept(dept) {
  var msg = '【' + dept.name + '】\n\n' + dept.intro + '\n\n📌 主要工作：\n';
  for (var i = 0; i < dept.activities.length; i++) {
    msg += '  ' + (i + 1) + '. ' + dept.activities[i] + '\n';
  }
  msg += '\n👥 岗位设置：\n';
  for (var j = 0; j < dept.positions.length; j++) {
    msg += '  ' + (j + 1) + '. ' + dept.positions[j].name + ' — ' + dept.positions[j].description + '\n';
  }
  msg += '\n想了解具体岗位的工作内容和时间，可以点击「📋 快速测评」或「💬 自由描述」哦～';
  return msg;
}

function askDept(name) {
  addUserMsg('我想了解' + name);

function startQuiz() {
  quizState = { step: 0 };

  quizAnswers = {
    traits: {
      communication: 0,
      creativity: 0,
      writing: 0,
      visual: 0,
      execution: 0,
      detail: 0,
      service: 0
    },
    time: null,
    growth: null
  };

  quizEntry.disabled = true;
  sendBtn.disabled = true;
  msgInput.disabled = true;
  msgInput.placeholder = "请在上方选择答案...";

  showQuizQ();
}

function showQuizQ() {
  var step = quizState.step;
  var question = QUIZ[step];

  var btns = question.options.map(function(option, index) {
    return {
      label: option.label,
      action: function() {
        pickAnswer(index, step);
      }
    };
  });

  addBotMsg(
    "🤔 第 " +
      (step + 1) +
      "/" +
      QUIZ.length +
      " 题\n\n" +
      question.question,
    renderQuizBtns(btns)
  );
}

function pickAnswer(index, expectedStep) {
  // 防止重复点击旧题目的按钮
  if (!quizState || quizState.step !== expectedStep) {
    return;
  }

  var question = QUIZ[quizState.step];
  var chosen = question.options[index];

  if (question.type === "trait") {
    var scoreKeys = Object.keys(chosen.scores);

    for (var i = 0; i < scoreKeys.length; i++) {
      var key = scoreKeys[i];
      quizAnswers.traits[key] += chosen.scores[key];
    }
  }

  if (question.type === "time") {
    quizAnswers.time = chosen.timeValue;
  }

  if (question.type === "growth") {
    quizAnswers.growth = chosen.growth;
  }

  addUserMsg(chosen.label);
  quizState.step++;

  if (quizState.step < QUIZ.length) {
    setTimeout(function() {
      showQuizQ();
    }, 350);
  } else {
    setTimeout(function() {
      showResult();
    }, 500);
  }
}



// ==================== 评分引擎（两种推荐模式共用） ====================
function scoreAllPositions(traits) {
  var results = [];
  for (var i = 0; i < KNOWLEDGE.departments.length; i++) {
    var dept = KNOWLEDGE.departments[i];
    for (var j = 0; j < dept.positions.length; j++) {
      var pos = dept.positions[j];
      var score = 0;
      var matchedTraits = [];

      var posTraits = pos.tags.concat(pos.fit);
      for (var k = 0; k < posTraits.length; k++) {
        for (var m = 0; m < traits.length; m++) {
          if (posTraits[k].indexOf(traits[m]) !== -1 || traits[m].indexOf(posTraits[k]) !== -1) {
            score++;
            if (matchedTraits.indexOf(posTraits[k]) === -1) {
              matchedTraits.push(posTraits[k]);
            }
          }
        }
      }

      results.push({
        deptName: dept.name,
        deptId: dept.id,
        position: pos,
        score: score,
        matched: matchedTraits
      });
    }
  }
  results.sort(function(a, b) { return b.score - a.score; });
  return results;
}

// ==================== 新版公平匹配算法 ====================

// 计算每个维度在整份问卷中理论上能够获得的最高分
function getTraitMaximums() {
  var maximums = {
    communication: 0,
    creativity: 0,
    writing: 0,
    visual: 0,
    execution: 0,
    detail: 0,
    service: 0
  };

  for (var i = 0; i < MATCH_QUIZ.length; i++) {
    var question = MATCH_QUIZ[i];

    if (question.type !== "trait") {
      continue;
    }

    var questionMaximums = {
      communication: 0,
      creativity: 0,
      writing: 0,
      visual: 0,
      execution: 0,
      detail: 0,
      service: 0
    };

    for (var j = 0; j < question.options.length; j++) {
      var scores = question.options[j].scores;
      var keys = Object.keys(scores);

      for (var k = 0; k < keys.length; k++) {
        var key = keys[k];

        if (scores[key] > questionMaximums[key]) {
          questionMaximums[key] = scores[key];
        }
      }
    }

    var dimensionKeys = Object.keys(maximums);

    for (var m = 0; m < dimensionKeys.length; m++) {
      var dimension = dimensionKeys[m];
      maximums[dimension] += questionMaximums[dimension];
    }
  }

  return maximums;
}

// 将用户各维度转换为0～3，避免某些维度因题目出现次数多而占优势
function normalizeQuizTraits(rawTraits) {
  var maximums = getTraitMaximums();
  var normalized = {};
  var keys = Object.keys(rawTraits);

  for (var i = 0; i < keys.length; i++) {
    var key = keys[i];

    if (maximums[key] > 0) {
      normalized[key] = rawTraits[key] / maximums[key] * 3;
    } else {
      normalized[key] = 0;
    }
  }

  return normalized;
}

function getTimeCompatibility(availableTime, requiredTime) {
  if (availableTime === null || availableTime === undefined) {
    return 0.7;
  }

  var difference = availableTime - requiredTime;

  if (difference >= 0) {
    return 1;
  }

  if (difference === -1) {
    return 0.7;
  }

  if (difference === -2) {
    return 0.3;
  }

  return 0;
}

function getMatchLevel(score) {
  if (score >= 82) {
    return "匹配程度较高";
  }

  if (score >= 70) {
    return "有较多契合点";
  }

  if (score >= 58) {
    return "值得进一步了解";
  }

  return "可以作为探索方向";
}

function getProfileMatchReasons(profile, userTraits) {
  var reasons = [];
  var dimensions = [
    "communication",
    "creativity",
    "writing",
    "visual",
    "execution",
    "detail",
    "service"
  ];

  for (var i = 0; i < dimensions.length; i++) {
    var key = dimensions[i];
    var requirement = profile.scores[key];
    var userValue = userTraits[key] || 0;
    var closeness = 1 - Math.abs(userValue - requirement) / 3;

    if (requirement >= 2 && userValue >= 1) {
      reasons.push({
        key: key,
        value: requirement * 2 + closeness
      });
    }
  }

  reasons.sort(function(a, b) {
    return b.value - a.value;
  });

  return reasons.slice(0, 3).map(function(item) {
    return MATCH_DIMENSION_LABELS[item.key];
  });
}

function scoreFairProfiles(answerData) {
  var userTraits = normalizeQuizTraits(answerData.traits);
  var results = [];

  for (var i = 0; i < POSITION_PROFILES.length; i++) {
    var profile = POSITION_PROFILES[i];
    var dimensions = [
      "communication",
      "creativity",
      "writing",
      "visual",
      "execution",
      "detail",
      "service"
    ];

    var compatibilityTotal = 0;

    for (var j = 0; j < dimensions.length; j++) {
      var key = dimensions[j];
      var userValue = userTraits[key] || 0;
      var roleValue = profile.scores[key];
      var closeness = 1 - Math.abs(userValue - roleValue) / 3;

      compatibilityTotal += Math.max(0, closeness);
    }

    var capabilityScore =
      compatibilityTotal / dimensions.length * 85;

    var timeScore =
      getTimeCompatibility(
        answerData.time,
        profile.scores.time
      ) * 15;

    results.push({
      profile: profile,
      matchScore: capabilityScore + timeScore,
      reasons: getProfileMatchReasons(profile, userTraits)
    });
  }

  results.sort(function(a, b) {
    if (b.matchScore !== a.matchScore) {
      return b.matchScore - a.matchScore;
    }

    // 同分时按岗位ID排序，避免受到原始数据排列顺序影响
    return a.profile.id.localeCompare(b.profile.id, "zh-CN");
  });

  return results;
}

// 在分数接近时优先展示不同类型、不同部门的岗位
function pickCurrentRecommendations(ranked) {
  if (ranked.length <= 2) {
    return ranked.slice();
  }

  var selected = [ranked[0]];
  var normalSecond = ranked[1];
  var alternative = null;

  for (var i = 1; i < ranked.length; i++) {
    var candidate = ranked[i];

    if (
      candidate.matchScore >= normalSecond.matchScore - 5 &&
      candidate.profile.family !== selected[0].profile.family &&
      candidate.profile.department !== selected[0].profile.department
    ) {
      alternative = candidate;
      break;
    }
  }

  selected.push(alternative || normalSecond);
  return selected;
}

function pickGrowthRecommendation(ranked, selected, growthGoal) {
  var selectedIds = {};

  for (var i = 0; i < selected.length; i++) {
    selectedIds[selected[i].profile.id] = true;
  }

  var candidates = [];

  for (var j = 0; j < ranked.length; j++) {
    var item = ranked[j];
    var profile = item.profile;

    if (selectedIds[profile.id]) {
      continue;
    }

    var growthScore;

    if (growthGoal === "explore" || !growthGoal) {
      growthScore = item.matchScore;
    } else {
      var directionStrength = profile.scores[growthGoal] / 3;
      var listedAsGrowth =
        profile.growth.indexOf(growthGoal) !== -1 ? 1 : 0;

      growthScore =
        directionStrength * 60 +
        listedAsGrowth * 20 +
        item.matchScore * 0.2;
    }

    candidates.push({
      profile: profile,
      matchScore: item.matchScore,
      growthScore: growthScore,
      reasons: item.reasons
    });
  }

  candidates.sort(function(a, b) {
    if (b.growthScore !== a.growthScore) {
      return b.growthScore - a.growthScore;
    }

    return a.profile.id.localeCompare(b.profile.id, "zh-CN");
  });

  // 尽量避免成长推荐与当前推荐完全属于同一类型
  for (var k = 0; k < candidates.length; k++) {
    var sameFamily = false;

    for (var m = 0; m < selected.length; m++) {
      if (
        candidates[k].profile.family ===
        selected[m].profile.family
      ) {
        sameFamily = true;
      }
    }

    if (!sameFamily) {
      return candidates[k];
    }
  }

  return candidates.length ? candidates[0] : null;
}

function buildCurrentProfileCard(item, index) {
  var profile = item.profile;
  var reasonText = item.reasons.length
    ? "你的回答体现出对" +
      item.reasons.join("、") +
      "等方面的偏好。"
    : "这个岗位与你的部分工作偏好比较接近。";

  var badge =
    index === 0
      ? '<span class="rec-badge">当前契合</span>'
      : '<span class="rec-badge">相近方向</span>';

  return (
    '<div class="rec-card">' +
      badge +
      '<div class="rec-title">📌 ' +
        escapeHtml(profile.position) +
      "</div>" +
      '<div class="rec-dept">🏛️ ' +
        escapeHtml(profile.department) +
      "</div>" +
      '<div class="rec-section">' +
        '<div class="rec-label">匹配判断</div>' +
        '<div class="rec-text">' +
          escapeHtml(getMatchLevel(item.matchScore)) +
        "</div>" +
      "</div>" +
      '<div class="rec-reason">💡 ' +
        escapeHtml(reasonText) +
      "</div>" +
      (profile.skillNotice
        ? '<div class="rec-section">' +
            '<div class="rec-label">进一步确认</div>' +
            '<div class="rec-text">' +
              escapeHtml(profile.skillNotice) +
            "</div>" +
          "</div>"
        : "") +
    "</div>"
  );
}

function buildGrowthProfileCard(item, growthGoal) {
  var profile = item.profile;
  var growthLabel =
    growthGoal === "explore" || !growthGoal
      ? "多方向探索"
      : MATCH_DIMENSION_LABELS[growthGoal];

  return (
    '<div class="rec-card">' +
      '<span class="rec-badge">成长探索</span>' +
      '<div class="rec-title">🌱 ' +
        escapeHtml(profile.position) +
      "</div>" +
      '<div class="rec-dept">🏛️ ' +
        escapeHtml(profile.department) +
      "</div>" +
      '<div class="rec-reason">这个岗位可能帮助你继续发展“' +
        escapeHtml(growthLabel) +
        "”方向，但不代表你目前已经具备全部岗位技能。</div>" +
      (profile.skillNotice
        ? '<div class="rec-section">' +
            '<div class="rec-label">进一步确认</div>' +
            '<div class="rec-text">' +
              escapeHtml(profile.skillNotice) +
            "</div>" +
          "</div>"
        : "") +
    "</div>"
  );
}

function showFairRecommendResults(answerData) {
  var ranked = scoreFairProfiles(answerData);
  var currentRecommendations =
    pickCurrentRecommendations(ranked);

  var growthRecommendation =
    pickGrowthRecommendation(
      ranked,
      currentRecommendations,

  var html = '<div class="recommend-cards">';

  for (
    var i = 0;
    i < currentRecommendations.length;

    var traits = extractTraits(text);
    if (traits.length === 0) {
      addBotMsg('抱歉，从你的描述中没有提取到足够的关键信息 😅\n\n建议你再详细一点，比如告诉我你的性格（外向/细心/有创意等）、爱好（写作/拍照/设计等）、或者偏好（不想太忙/愿意多投入等）。\n\n你也可以试试「📋 快速测评」，只需回答几个选择题就行~');
      return;
    }
    var allPositions = scoreAllPositions(traits);
    showRecommendResults(allPositions, '根据你的描述，我为你推荐以下岗位：');
  }, 800);
}

// ==================== 消息渲染 ====================
function addBotMsg(text, extraHtml) {
  var html = '<div class="message bot"><div class="avatar">🤖</div><div class="bubble">' + escapeHtml(text) + '</div></div>';
  if (extraHtml) {
    html = '<div class="message bot"><div class="avatar">🤖</div><div class="bubble">' + escapeHtml(text) + extraHtml + '</div></div>';
  }
  chatArea.insertAdjacentHTML('beforeend', html);
  scrollBottom();
}

function addUserMsg(text) {
  var html = '<div class="message user"><div class="avatar">👤</div><div class="bubble">' + escapeHtml(text) + '</div></div>';
  chatArea.insertAdjacentHTML('beforeend', html);
  scrollBottom();
}

function renderChips(chips) {
  var html = '<div class="quick-row">';
  for (var i = 0; i < chips.length; i++) {
    var cls = chips[i].highlight ? 'quick-chip highlight' : 'quick-chip';
    var aid = storeAction(chips[i].action);
    html += '<span class="' + cls + '" data-act="' + aid + '">' + chips[i].label + '</span>';
  }
  html += '</div>';
  return html;
}

function renderQuizBtns(btns) {
  var html = '<div class="quiz-list">';
  for (var i = 0; i < btns.length; i++) {
    var aid = storeAction(btns[i].action);
    html += '<div class="quiz-btn" data-act="' + aid + '">' + btns[i].label + '</div>';
  }
  html += '</div>';
  return html;
}

function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function scrollBottom() {
  setTimeout(function() {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 100);
}
</script>
